<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina | Restaurante SENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/personal.css">
</head>
<body>
  <header class="barra">
    <h1><i class="ti ti-chef-hat" aria-hidden="true"></i> Cocina</h1>
    <div class="barra-derecha">
      <span class="usuario" id="usuarioNombre"></span>
      <button id="btnSonido" class="boton claro sonido-apagado" type="button"></button>
      <button class="boton claro" type="button" onclick="apiLogout()">
        <i class="ti ti-logout" aria-hidden="true"></i> <span class="ocultable">Salir</span>
      </button>
    </div>
  </header>

  <div class="estado-conexion" id="estadoConexion" role="status" aria-live="polite">Cargando…</div>

  <main class="tablero">
    <section class="columna" aria-labelledby="tituloPendientes">
      <h2 id="tituloPendientes">
        <span><i class="ti ti-clock" aria-hidden="true"></i> Pendientes</span>
        <span class="contador" id="numPendientes">0</span>
      </h2>
      <div class="lista" id="listaPendientes"></div>
    </section>
    <section class="columna" aria-labelledby="tituloPreparacion">
      <h2 id="tituloPreparacion">
        <span><i class="ti ti-flame" aria-hidden="true"></i> En preparación</span>
        <span class="contador" id="numPreparacion">0</span>
      </h2>
      <div class="lista" id="listaPreparacion"></div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/personal.js"></script>
  <script>
    const MIN_DEMORA = 15;    // tarjeta amarilla
    const MIN_URGENTE = 25;   // tarjeta roja
    const nuevos = new DetectorNuevos();
    let pedidos = [];
    let sondeo;

    function claseEspera(min) {
      return min >= MIN_URGENTE ? ' urgente' : min >= MIN_DEMORA ? ' demora' : '';
    }

    function tarjeta(p) {
      const min = minutosDesde(p.fecha_pedido);
      const pendiente = p.estado === 'pendiente';
      return `<article class="tarjeta${claseEspera(min)}" data-id="${p.id_pedido}">
        <div class="tarjeta-cabeza">
          <div class="mesa-grande">Mesa ${p.numero_mesa}<small>${esc(p.numero_pedido)} · ${formatHora(p.fecha_pedido)}</small></div>
          <span class="espera"><i class="ti ti-hourglass" aria-hidden="true"></i> ${textoEspera(min)}</span>
        </div>
        <ul class="items">${(p.items || []).map(i => `
          <li><span class="cant">${i.cantidad}×</span><span>${esc(i.emoji || '')} ${esc(i.nombre)}</span></li>`).join('')}
        </ul>
        ${p.notas ? `<div class="notas"><strong>Nota:</strong> ${esc(p.notas)}</div>` : ''}
        ${p.origen === 'manual' ? `<div class="sin-qr"><i class="ti ti-alert-triangle" aria-hidden="true"></i> <strong>Sin QR</strong> · confirma que es la mesa ${p.numero_mesa}</div>` : ''}
        <div class="acciones">
          ${pendiente
            ? `<button class="boton primario" data-accion="en_preparacion"><i class="ti ti-flame"></i> Empezar</button>`
            : `<button class="boton listo" data-accion="listo"><i class="ti ti-circle-check"></i> Listo</button>`}
          <button class="boton peligro" data-accion="cancelado" aria-label="Cancelar pedido de la mesa ${p.numero_mesa}">
            <i class="ti ti-x"></i></button>
        </div>
      </article>`;
    }

    function pintar() {
      const pendientes = pedidos.filter(p => p.estado === 'pendiente');
      const enPreparacion = pedidos.filter(p => p.estado === 'en_preparacion');
      const columna = (lista, idLista, idNum, textoVacio) => {
        document.getElementById(idNum).textContent = lista.length;
        document.getElementById(idLista).innerHTML = lista.length
          ? lista.map(tarjeta).join('')
          : `<div class="vacio"><i class="ti ti-mood-happy" aria-hidden="true"></i>${textoVacio}</div>`;
      };
      columna(pendientes, 'listaPendientes', 'numPendientes', 'No hay pedidos pendientes');
      columna(enPreparacion, 'listaPreparacion', 'numPreparacion', 'Nada en preparación');
      document.title = pendientes.length ? `(${pendientes.length}) Cocina | Restaurante SENA` : 'Cocina | Restaurante SENA';
    }

    async function cargar() {
      const r = await apiPersonal('/pedidos?estado=pendiente,en_preparacion&items=1&orden=asc&limit=100');
      if (!r.ok) return false;
      pedidos = r.data;
      const llegaron = nuevos.revisar(pedidos.filter(p => p.estado === 'pendiente').map(p => p.id_pedido));
      if (llegaron) {
        Sonido.tocar('pedido');
        showToast(llegaron === 1 ? 'Llegó un pedido nuevo' : `Llegaron ${llegaron} pedidos nuevos`, 'info');
      }
      pintar();
      return true;
    }

    // Botones de las tarjetas (delegación de eventos)
    document.querySelector('.tablero').addEventListener('click', async (e) => {
      const boton = e.target.closest('button[data-accion]');
      if (!boton) return;
      const tarjetaEl = boton.closest('.tarjeta');
      const id = Number(tarjetaEl.dataset.id);
      const pedido = pedidos.find(p => p.id_pedido === id);
      const accion = boton.dataset.accion;
      if (accion === 'cancelado' &&
          !await confirmarAccion(`¿Cancelar el pedido de la mesa ${pedido.numero_mesa} (${pedido.numero_pedido})?`, 'Sí, cancelar')) {
        return;
      }
      tarjetaEl.querySelectorAll('button').forEach(b => b.disabled = true);
      if (await cambiarEstadoPedido(id, accion)) {
        const textos = { en_preparacion: 'En preparación', listo: 'Listo: el mesero ya puede llevarlo', cancelado: 'Pedido cancelado' };
        showToast(`Mesa ${pedido.numero_mesa}: ${textos[accion]}`, 'success');
      }
      sondeo.ahora();
    });

    (async () => {
      await iniciarPantallaPersonal(['Chef', 'Administrador']);
      configurarBotonSonido('btnSonido');
      document.getElementById('btnSonido').addEventListener('click', () =>
        document.getElementById('btnSonido').classList.remove('sonido-apagado'));
      sondeo = iniciarSondeo(cargar, 'estadoConexion');
      setInterval(pintar, 30000);   // refresca los minutos de espera
    })();
  </script>
</body>
</html>
