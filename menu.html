<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú | Restaurante SENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g:   #006633; --gd: #004d26; --gm: #008040;
      --gl:  #eef7f2; --g2: #d0e9dc;
      --y:   #FFD100; --yd: #b89600; --yp: rgba(255,209,0,.12);
      --wh:  #ffffff; --bg: #f5f7f5;
      --tx:  #0e1c12; --tm: #3a5544; --bd: #c0d9c8;
      --r:   16px;    --rs: 10px;
      --shadow:   0 20px 56px rgba(0,60,20,.11);
      --shadowsm: 0 6px 22px rgba(0,60,20,.08);
      --shadowxs: 0 2px 10px rgba(0,60,20,.06);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--tx); }

    /* ── NAV ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(245,247,245,.92);
      backdrop-filter: blur(16px) saturate(1.8);
      border-bottom: 1px solid rgba(192,217,200,.55);
    }
    .nav-inner {
      max-width: 1280px; margin: 0 auto;
      height: 64px; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-badge {
      width: 36px; height: 36px; background: var(--g); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(0,102,51,.28);
    }
    .logo-badge i { font-size: 18px; color: var(--y); }
    .logo-text {
      font-family: 'Playfair Display', serif; font-size: 17px;
      font-weight: 700; color: var(--tx);
    }
    .logo-text em { color: var(--g); font-style: normal; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .mesa-tag {
      background: var(--gl); border: 1px solid var(--g2);
      border-radius: 20px; padding: 5px 14px;
      font-size: 12.5px; font-weight: 600; color: var(--gd);
      display: flex; align-items: center; gap: 6px;
    }
    .mesa-tag i { font-size: 13px; }
    .btn-cart {
      display: flex; align-items: center; gap: 8px;
      background: var(--g); color: #fff;
      padding: 8px 18px; border-radius: 9px;
      font-size: 13.5px; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      font-family: inherit; position: relative;
      box-shadow: 0 3px 10px rgba(0,102,51,.24);
      transition: background .15s, transform .1s;
    }
    .btn-cart:hover { background: var(--gd); transform: translateY(-1px); }
    .btn-cart i { font-size: 16px; }
    .cart-badge {
      position: absolute; top: -7px; right: -7px;
      background: var(--y); color: var(--tx);
      border-radius: 50%; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; border: 2px solid var(--bg);
    }

    /* ── PAGE HEADER ── */
    .page-header {
      background: var(--g); padding: 2.8rem 2rem 2.4rem;
      position: relative; overflow: hidden;
    }
    .page-header::before {
      content: ''; position: absolute;
      width: 340px; height: 340px; border-radius: 50%;
      border: 55px solid rgba(255,209,0,.07);
      top: -100px; right: -80px; pointer-events: none;
    }
    .page-header::after {
      content: ''; position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      border: 35px solid rgba(255,255,255,.05);
      bottom: -70px; left: -50px; pointer-events: none;
    }
    .page-header-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 1rem;
      position: relative; z-index: 1;
    }
    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 38px); font-weight: 900;
      color: #fff; line-height: 1.15; margin-bottom: 5px;
    }
    .page-header h1 em { color: var(--y); font-style: italic; }
    .page-header p { font-size: 14px; color: rgba(255,255,255,.6); }
    .mesa-header-tag {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px; padding: 7px 18px;
      font-size: 13px; font-weight: 600; color: #fff;
      display: flex; align-items: center; gap: 7px;
      white-space: nowrap;
    }
    .mesa-header-tag i { font-size: 14px; color: var(--y); }

    /* ── CONTROLS ── */
    .menu-controls {
      background: var(--wh);
      border-bottom: 1px solid var(--bd);
      position: sticky; top: 64px; z-index: 80;
      box-shadow: 0 2px 12px rgba(0,60,20,.05);
    }
    .controls-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 1rem 2rem;
      display: flex; align-items: center;
      gap: 1rem; flex-wrap: wrap;
    }
    .search-wrap {
      position: relative; flex: 0 0 260px;
    }
    .search-wrap i {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px; color: var(--tm); pointer-events: none;
    }
    .search-inp {
      width: 100%; padding: 9px 14px 9px 38px;
      border: 1.5px solid var(--bd); border-radius: 9px;
      font-size: 13.5px; font-family: inherit; color: var(--tx);
      background: var(--bg); outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .search-inp:focus {
      border-color: var(--g);
      box-shadow: 0 0 0 3px rgba(0,102,51,.1);
      background: #fff;
    }
    .search-inp::placeholder { color: #9fb5a7; }
    .cats { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-btn {
      padding: 7px 16px; border-radius: 20px;
      border: 1.5px solid var(--bd);
      background: var(--bg); color: var(--tm);
      font-size: 13px; font-weight: 500;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all .15s;
    }
    .cat-btn:hover { border-color: var(--g); color: var(--g); background: var(--gl); }
    .cat-btn.active {
      background: var(--g); color: #fff;
      border-color: var(--g);
      box-shadow: 0 3px 10px rgba(0,102,51,.22);
    }
    .cat-btn i { font-size: 14px; }

    /* ── LAYOUT ── */
    .menu-wrap {
      max-width: 1280px; margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 2rem; align-items: start;
    }

    /* ── PRODUCTS GRID ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
    }
    .product-card {
      background: var(--wh);
      border-radius: 18px;
      border: 1px solid var(--bd);
      overflow: hidden; cursor: pointer;
      transition: box-shadow .22s, transform .22s, border-color .2s;
      animation: fadeUp .35s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    .product-card:hover {
      box-shadow: var(--shadowsm);
      transform: translateY(-5px);
      border-color: var(--gm);
    }
    .product-img {
      background: var(--gl); height: 130px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.8rem; position: relative;
      border-bottom: 1px solid var(--g2);
    }
    .product-badge {
      position: absolute; top: 10px; right: 10px;
      background: var(--wh); color: var(--gd);
      border: 1px solid var(--g2);
      border-radius: 12px; padding: 3px 10px;
      font-size: 11px; font-weight: 600;
    }
    .product-info { padding: 1rem 1.1rem 1rem; }
    .product-info h3 {
      font-size: 14.5px; font-weight: 600; color: var(--tx);
      margin-bottom: 4px; line-height: 1.3;
    }
    .product-info p {
      font-size: 12.5px; color: var(--tm);
      line-height: 1.55; margin-bottom: .8rem;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-footer {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .product-price {
      font-family: 'Playfair Display', serif;
      font-size: 16px; font-weight: 700; color: var(--g);
    }
    .btn-add {
      width: 34px; height: 34px;
      background: var(--g); color: #fff;
      border: none; border-radius: 9px;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      box-shadow: 0 3px 8px rgba(0,102,51,.25);
    }
    .btn-add:hover { background: var(--gd); transform: scale(1.08); }

    /* ── CART SIDEBAR ── */
    .cart-sidebar {
      position: sticky; top: calc(64px + 68px + 1.5rem);
    }
    .cart-box {
      background: var(--wh);
      border-radius: 20px; border: 1px solid var(--bd);
      box-shadow: var(--shadowsm);
      overflow: hidden;
    }
    .cart-header {
      background: var(--g); padding: 1.1rem 1.4rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-header-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .cart-header-title i { font-size: 18px; color: var(--y); }
    .cart-count-badge {
      background: var(--y); color: var(--tx);
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .cart-body { padding: 0; }
    .cart-items { padding: .5rem .5rem; max-height: 280px; overflow-y: auto; }
    .cart-items::-webkit-scrollbar { width: 4px; }
    .cart-items::-webkit-scrollbar-track { background: var(--gl); }
    .cart-items::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 2px; }
    .cart-empty {
      text-align: center; padding: 2rem 1rem;
      color: var(--tm); font-size: 13px; line-height: 1.6;
    }
    .cart-empty i { font-size: 32px; color: var(--bd); display: block; margin-bottom: 8px; }
    .cart-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 6px;
      border-bottom: 1px solid var(--gl);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-emoji { font-size: 1.5rem; flex-shrink: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 13px; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-price { font-size: 12px; color: var(--g); font-weight: 600; margin-top: 2px; }
    .cart-qty-ctrl { display: flex; align-items: center; gap: 5px; }
    .qty-btn {
      width: 26px; height: 26px;
      background: var(--gl); border: 1px solid var(--g2);
      border-radius: 7px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gd); transition: background .15s;
    }
    .qty-btn:hover { background: var(--g2); }
    .cart-item-qty { font-size: 13px; font-weight: 600; color: var(--tx); min-width: 16px; text-align: center; }
    .cart-remove {
      background: none; border: none; cursor: pointer;
      color: var(--bd); font-size: 14px; padding: 4px;
      border-radius: 6px; transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-remove:hover { color: #e53e3e; background: #fff5f5; }
    .notes-area { padding: .6rem 1rem; border-top: 1px solid var(--gl); }
    .notes-input {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--bd); border-radius: 9px;
      font-size: 12.5px; font-family: inherit; color: var(--tx);
      background: var(--bg); outline: none; resize: none; min-height: 64px;
      transition: border-color .2s;
    }
    .notes-input:focus { border-color: var(--g); background: #fff; }
    .notes-input::placeholder { color: #9fb5a7; }
    .cart-summary {
      padding: .8rem 1.2rem;
      background: var(--gl);
      border-top: 1px solid var(--g2);
    }
    .cart-row {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--tm); padding: 4px 0;
    }
    .cart-total {
      display: flex; justify-content: space-between;
      font-size: 15px; font-weight: 700; color: var(--tx);
      padding: 8px 0 4px; border-top: 1px solid var(--g2);
      margin-top: 4px;
    }
    .cart-total span:last-child { color: var(--g); font-family: 'Playfair Display', serif; font-size: 16px; }
    .cart-actions { padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
    .btn-confirm {
      width: 100%; padding: 13px;
      background: var(--g); color: #fff;
      border: none; border-radius: var(--rs);
      font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(0,102,51,.28);
      transition: background .15s, transform .1s;
    }
    .btn-confirm:hover { background: var(--gd); transform: translateY(-1px); }
    .btn-confirm i { font-size: 17px; }
    .btn-clear {
      width: 100%; padding: 10px;
      background: transparent; color: var(--tm);
      border: 1.5px solid var(--bd); border-radius: var(--rs);
      font-size: 13px; font-weight: 500;
      font-family: inherit; cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .btn-clear:hover { border-color: var(--g); color: var(--g); background: var(--gl); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10,28,16,.58);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--wh); border-radius: 24px;
      padding: 2.4rem; width: 100%; max-width: 460px;
      box-shadow: var(--shadow); position: relative;
      animation: modalIn .25s ease;
    }
    @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(14px); } to { opacity:1; transform:none; } }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: var(--gl); border: 1px solid var(--bd);
      width: 32px; height: 32px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; color: var(--tm);
      transition: background .15s;
    }
    .modal-close:hover { background: var(--g2); }
    .modal-close i { font-size: 15px; }
    .modal-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700; color: var(--tx);
      margin-bottom: 4px;
    }
    .modal-box > p { font-size: 13.5px; color: var(--tm); margin-bottom: 1.4rem; }
    .confirm-summary {
      background: var(--gl); border: 1px solid var(--g2);
      border-radius: 12px; padding: 14px;
      margin-bottom: 1.2rem;
      max-height: 200px; overflow-y: auto;
    }
    .confirm-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 7px 0;
      border-bottom: 1px solid var(--g2);
      font-size: 13.5px; color: var(--tx);
    }
    .confirm-row:last-child { border-bottom: none; font-weight: 700; color: var(--g); }
    .confirm-row span:first-child { flex: 1; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--tx); margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--bd); border-radius: var(--rs);
      font-size: 14px; font-family: inherit; color: var(--tx);
      background: #fafaf9; outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--g); background: #fff; }
    .form-input[readonly] { background: var(--bg); color: var(--tm); }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1/-1; text-align: center;
      padding: 5rem 2rem; color: var(--tm);
    }
    .empty-state i { font-size: 48px; color: var(--bd); display: block; margin-bottom: 12px; }
    .empty-state h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .empty-state p { font-size: 14px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .menu-wrap { grid-template-columns: 1fr; }
      .cart-sidebar { display: none; }
    }
    @media (max-width: 600px) {
      .controls-inner { gap: .7rem; }
      .search-wrap { flex: 1; min-width: 0; }
      .page-header { padding: 2rem 1.2rem; }
      .menu-wrap { padding: 1.2rem; }
    }
  </style>
</head>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-badge"><i class="ti ti-tools-kitchen-2" aria-hidden="true"></i></div>
        <span class="logo-text">Restaurante <em>SENA</em></span>
      </a>
      <div class="nav-right">
        <span id="mesaTag" class="mesa-tag">
          <i class="ti ti-armchair" aria-hidden="true"></i>
          Mesa —
        </span>
        <a href="carrito.html" class="btn-cart">
          <i class="ti ti-shopping-cart" aria-hidden="true"></i>
          Carrito
          <span class="cart-badge cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="page-header-inner">
      <div>
        <h1>Nuestro <em>Menú</em></h1>
        <p>Cocina colombiana auténtica · Ingredientes frescos de temporada</p>
      </div>
      <span id="mesaHeaderTag" class="mesa-header-tag">
        <i class="ti ti-armchair" aria-hidden="true"></i>
        Mesa —
      </span>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="menu-controls">
    <div class="controls-inner">
      <form method="GET" action="menu.html" style="display:contents" onsubmit="return false">
        <div class="search-wrap">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="search" name="q" id="searchInput" class="search-inp"
            placeholder="Buscar platos…" oninput="filterMenu()">
        </div>
      </form>
      <div class="cats" id="catBtns">
        <button class="cat-btn active" onclick="setCategory('Todos', this)">
          <i class="ti ti-layout-grid" aria-hidden="true"></i> Todos
        </button>
        <button class="cat-btn" onclick="setCategory('Entradas', this)">
          <i class="ti ti-bread" aria-hidden="true"></i> Entradas
        </button>
        <button class="cat-btn" onclick="setCategory('Principales', this)">
          <i class="ti ti-tools-kitchen" aria-hidden="true"></i> Principales
        </button>
        <button class="cat-btn" onclick="setCategory('Bebidas', this)">
          <i class="ti ti-glass" aria-hidden="true"></i> Bebidas
        </button>
        <button class="cat-btn" onclick="setCategory('Postres', this)">
          <i class="ti ti-cake" aria-hidden="true"></i> Postres
        </button>
      </div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="menu-wrap">
    <div id="productsGrid" class="products-grid"></div>

    <!-- CART SIDEBAR -->
    <aside class="cart-sidebar">
      <div class="cart-box">
        <div class="cart-header">
          <span class="cart-header-title">
            <i class="ti ti-shopping-bag" aria-hidden="true"></i>
            Mi Pedido
          </span>
          <span class="cart-count-badge cart-count">0</span>
        </div>
        <div class="cart-body">
          <div id="cartItems" class="cart-items">
            <div class="cart-empty">
              <i class="ti ti-shopping-cart" aria-hidden="true"></i>
              Tu carrito está vacío.<br>¡Agrega tus platos favoritos!
            </div>
          </div>
          <div class="notes-area">
            <textarea id="notasInput" class="notes-input"
              placeholder="Notas especiales (alergias, preferencias…)"></textarea>
          </div>
          <div id="cartSummary" class="cart-summary" style="display:none">
            <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
            <div class="cart-row"><span>Servicio (10%)</span><span id="cartServicio">$0</span></div>
            <div class="cart-row"><span>IVA (19%)</span><span id="cartIva">$0</span></div>
            <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
          </div>
          <div class="cart-actions">
            <button class="btn-confirm" onclick="openConfirmModal()">
              <i class="ti ti-check" aria-hidden="true"></i>
              Confirmar Pedido
            </button>
            <button class="btn-clear" onclick="clearCart();renderCartSidebar()">
              Limpiar carrito
            </button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirmModal" class="modal-overlay" onclick="closeConfirm(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeConfirm()" aria-label="Cerrar">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
      <h2>Confirmar Pedido</h2>
      <p>Revisa tu pedido antes de enviarlo a cocina.</p>
      <div id="confirmSummary" class="confirm-summary"></div>
      <form id="pedidoForm" method="POST" action="pedido.html" onsubmit="return submitPedido(event)">
        <input type="hidden" name="action" value="crearPedido">
        <input type="hidden" id="hiddenMesa"  name="mesa"  value="">
        <input type="hidden" id="hiddenItems" name="items" value="">
        <input type="hidden" id="hiddenNotas" name="notas" value="">
        <div class="form-group">
          <label class="form-label">Mesa confirmada</label>
          <input type="text" id="mesaConfirm" class="form-input" readonly>
        </div>
        <button type="submit" class="btn-confirm" style="margin-top:4px">
          <i class="ti ti-send" aria-hidden="true"></i>
          Enviar Pedido a Cocina
        </button>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    let currentCat = 'Todos';
    let currentSearch = '';

    const mesaNum = JSP.request.getParameter('mesa') || JSP.session.get('currentMesa') || '1';
    JSP.session.set('currentMesa', mesaNum);

    document.getElementById('mesaTag').innerHTML = `<i class="ti ti-armchair" aria-hidden="true"></i> Mesa #${mesaNum}`;
    document.getElementById('mesaHeaderTag').innerHTML = `<i class="ti ti-armchair" aria-hidden="true"></i> Mesa #${mesaNum}`;

    function setCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function filterMenu() {
      currentSearch = document.getElementById('searchInput').value.toLowerCase();
      renderProducts();
    }

    function renderProducts() {
      const prods = getProductos().filter(p => p.disponible);
      let filtered = prods;
      if (currentCat !== 'Todos') filtered = filtered.filter(p => p.cat === currentCat);
      if (currentSearch) filtered = filtered.filter(p =>
        p.nombre.toLowerCase().includes(currentSearch) ||
        p.desc.toLowerCase().includes(currentSearch)
      );

      const grid = document.getElementById('productsGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state">
          <i class="ti ti-search" aria-hidden="true"></i>
          <h3>No hay platos que coincidan</h3>
          <p>Intenta con otra búsqueda o categoría</p>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map((p, i) => `
        <div class="product-card" style="animation-delay:${i * 0.05}s" onclick="addToCart(${p.id})">
          <div class="product-img">
            <span>${p.emoji}</span>
            <span class="product-badge">${p.cat}</span>
          </div>
          <div class="product-info">
            <h3>${p.nombre}</h3>
            <p>${p.desc}</p>
            <div class="product-footer">
              <span class="product-price">${formatCOP(p.precio)}</span>
              <button class="btn-add" onclick="event.stopPropagation();addToCart(${p.id})" aria-label="Agregar al carrito">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderCartSidebar() {
      const cart = getCart();
      const itemsEl = document.getElementById('cartItems');
      const summEl  = document.getElementById('cartSummary');
      const counts  = document.querySelectorAll('.cart-count');

      counts.forEach(el => el.textContent = cart.reduce((s,i) => s + i.qty, 0));

      if (!cart.length) {
        itemsEl.innerHTML = `<div class="cart-empty">
          <i class="ti ti-shopping-cart" aria-hidden="true"></i>
          Tu carrito está vacío.<br>¡Agrega tus platos favoritos!
        </div>`;
        summEl.style.display = 'none';
        return;
      }

      itemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span class="cart-item-emoji">${item.emoji}</span>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.nombre}</div>
            <div class="cart-item-price">${formatCOP(item.precio * item.qty)}</div>
          </div>
          <div class="cart-qty-ctrl">
            <button class="qty-btn" onclick="updateQty(${item.id},-1);renderCartSidebar()">−</button>
            <span class="cart-item-qty">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id},1);renderCartSidebar()">+</button>
          </div>
          <button class="cart-remove" onclick="removeFromCart(${item.id});renderCartSidebar()" aria-label="Eliminar">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </div>
      `).join('');

      const sub = getCartTotal();
      const srv = Math.round(sub * .10);
      const iva = Math.round(sub * .19);
      const tot = sub + srv + iva;
      summEl.style.display = 'block';
      document.getElementById('cartSubtotal').textContent = formatCOP(sub);
      document.getElementById('cartServicio').textContent = formatCOP(srv);
      document.getElementById('cartIva').textContent      = formatCOP(iva);
      document.getElementById('cartTotal').textContent    = formatCOP(tot);
    }

    function openConfirmModal() {
      const cart = getCart();
      if (!cart.length) { showToast('Tu carrito está vacío', 'warning'); return; }
      document.getElementById('mesaConfirm').value   = 'Mesa #' + mesaNum;
      document.getElementById('hiddenMesa').value    = mesaNum;
      document.getElementById('hiddenItems').value   = JSON.stringify(cart);
      document.getElementById('hiddenNotas').value   = document.getElementById('notasInput').value;
      const sub = getCartTotal();
      const srv = Math.round(sub*.10); const iva = Math.round(sub*.19);
      document.getElementById('confirmSummary').innerHTML =
        cart.map(i => `<div class="confirm-row">
          <span>${i.emoji} ${i.nombre} <span style="color:var(--tm);font-weight:400">×${i.qty}</span></span>
          <strong>${formatCOP(i.precio*i.qty)}</strong>
        </div>`).join('') +
        `<div class="confirm-row"><span>Total</span><strong>${formatCOP(sub+srv+iva)}</strong></div>`;
      document.getElementById('confirmModal').classList.add('open');
    }

    function closeConfirm(e) {
      if (!e || e.target === document.getElementById('confirmModal'))
        document.getElementById('confirmModal').classList.remove('open');
    }

    function submitPedido(e) {
      e.preventDefault();
      const cart = getCart();
      const notas = document.getElementById('notasInput').value;
      crearPedido(mesaNum, cart, notas);
      clearCart();
      document.getElementById('confirmModal').classList.remove('open');
      showToast('✅ Pedido enviado a cocina', 'success');
      setTimeout(() => { window.location.href = 'pedido.html'; }, 1200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      renderCartSidebar();
    });
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeConfirm(); });
    setInterval(renderCartSidebar, 500);
  </script>
</body>
</html>
